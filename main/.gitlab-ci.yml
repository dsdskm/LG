# .gitlab-ci.yml
#
# ✅ STS AssumeRole 보안 강화 버전 (DEBUG 모드 조건부 표시)
#
# 목표
# - dev 및 기타 브랜치: push 시 자동 파이프라인 (DEV: build→deploy→verify 자동)
# - qa / prd(production) 브랜치: 오직 GitLab UI의 "Run pipeline"(CI_PIPELINE_SOURCE=web)로만 파이프라인 생성 허용
#   - API(trigger/api), 다른 파이프라인(parent_pipeline), 스케줄(schedule) 등도 모두 차단
#   - 파이프라인이 시작되면 QA/PRD는 build→deploy→verify 모두 자동 수행 (job 내 manual 제거)
#
# 보안 개선사항
# - STS AssumeRole을 통한 임시 자격증명 사용 (1시간 유효)
# - External ID를 통한 추가 보안 검증
# - 권한 분리: 기본 사용자는 AssumeRole만 가능, 실제 배포 권한은 별도 Role
# - 민감한 정보 로그 노출 방지
# - DEBUG 모드에서만 디버그 job 표시

image: docker:25.0.5

workflow:
  rules:
    # QA: UI(web) 수동 파이프라인만 허용
    - if: '$CI_COMMIT_REF_NAME =~ /^(qa|QA)$/ && $CI_PIPELINE_SOURCE != "web"'
      when: never
    - if: '$CI_COMMIT_REF_NAME =~ /^(qa|QA)$/'
      variables:
        DEPLOY_ENVIRONMENT: 'qa'
        ENVIRONMENT_NAME: 'qa'
        ENVIRONMENT_URL: 'https://qa.hcrsp.com'

    # PRD/PROD: UI(web) 수동 파이프라인만 허용
    - if: '$CI_COMMIT_REF_NAME =~ /^(prd|PRD|prod|production)$/ && $CI_PIPELINE_SOURCE != "web"'
      when: never
    - if: '$CI_COMMIT_REF_NAME =~ /^(prd|PRD|prod|production)$/'
      variables:
        DEPLOY_ENVIRONMENT: 'prod'
        ENVIRONMENT_NAME: 'production'
        ENVIRONMENT_URL: 'https://hcrsp.com'

    # 그 외(dev/feature 등): 항상 파이프라인 생성 (push 자동 포함)
    - when: always
      variables:
        DEPLOY_ENVIRONMENT: 'dev'

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_API_VERSION: '1.43'
  DOCKER_BUILDKIT: '1'
  DEV_HTTP_PORT: '8081'
  DEV_HOST_IP: '10.158.2.175'
  # 디버그 모드 (개발/문제해결 시에만 true로 설정)
  # DEBUG_MODE: "false"
  # 진단 모드 (Runner 상태 확인용, 별도 제어)
  RUN_DIAG: 'false'
  # STS AssumeRole 설정
  DEPLOYMENT_ROLE_ARN: arn:aws:iam::398838060384:role/gitlab-ci-deployment-role
  EXTERNAL_ID: hcrsp-gitlab-deployment-2026

stages:
  - info
  - build
  - deploy
  - verify

# AssumeRole 공통 함수 정의
.assume_role_script: &assume_role_script
  - |
    # 🔐 STS AssumeRole 함수
    assume_aws_role() {
      if [ "$DEPLOY_ENVIRONMENT" = "dev" ]; then
        return 0
      fi
      
      # 기본 자격증명 확인
      if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
        echo "❌ AWS 자격 증명이 설정되지 않았습니다."
        return 1
      fi
      
      # DEBUG: AssumeRole 세부사항 (개발 시에만)
      # if [ "${DEBUG_MODE:-false}" = "true" ]; then
      #   echo "🔍 AssumeRole 시도: $DEPLOYMENT_ROLE_ARN"
      #   echo "🔍 External ID: ${EXTERNAL_ID:0:10}..."
      # fi
      
      # AssumeRole 실행 (출력 숨김)
      local temp_creds
      temp_creds=$(aws sts assume-role \
        --role-arn "$DEPLOYMENT_ROLE_ARN" \
        --role-session-name "gitlab-ci-${CI_JOB_ID}-$(date +%s)" \
        --external-id "$EXTERNAL_ID" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text 2>/dev/null)
      
      if [ $? -eq 0 ] && [ ! -z "$temp_creds" ]; then
        export AWS_ACCESS_KEY_ID=$(echo $temp_creds | cut -d' ' -f1)
        export AWS_SECRET_ACCESS_KEY=$(echo $temp_creds | cut -d' ' -f2)
        export AWS_SESSION_TOKEN=$(echo $temp_creds | cut -d' ' -f3)
        
        # DEBUG: 권한 확인 (개발 시에만)
        # if [ "${DEBUG_MODE:-false}" = "true" ]; then
        #   local caller_identity=$(aws sts get-caller-identity --query 'Arn' --output text 2>/dev/null)
        #   echo "🔍 AssumeRole 성공: ${caller_identity}"
        # fi
        
        return 0
      else
        echo "❌ AssumeRole 실패"
        return 1
      fi
    }

default:
  tags:
    - raus04
  before_script:
    # PATCH-A: aws-cli를 apk로 설치하지 않고, AWS CLI 공식 컨테이너로 aws 명령을 래핑
    - apk add --no-cache curl jq
    - |
      aws() {
        docker run --rm \
          -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
          -e AWS_DEFAULT_REGION -e AWS_REGION \
          -v "$PWD:/work" -w /work \
          public.ecr.aws/aws-cli/aws-cli:latest "$@"
      }
    - *assume_role_script
    - |
      set -e
      echo "🚀 ${CI_PROJECT_NAME} (${CI_COMMIT_SHORT_SHA}) | Branch: ${CI_COMMIT_REF_NAME} | Env: ${DEPLOY_ENVIRONMENT}"

      # 환경별 변수 세팅
      if [ "$DEPLOY_ENVIRONMENT" = "production" ] || [ "$DEPLOY_ENVIRONMENT" = "prod" ]; then
        export NODE_ENV="production"
        export ENVIRONMENT="production"
        export ENV="production"
        export ECR_REPOSITORY_NAME="rsp-prod-hrsp-web"
        export ECS_CLUSTER_NAME="rsp-prod-ecs"
        export ECS_SERVICE_NAME="rsp-prod-hrsp-web-service"
        export TASK_DEFINITION_NAME="rsp-prod-hrsp-web-task"
        export SERVICE_URL="https://hcrsp.com"
        export DOCKER_TAG="prod-${CI_COMMIT_SHORT_SHA}"
        export DOCKERFILE_DEPLOY_ENV="prod"
      elif [ "$DEPLOY_ENVIRONMENT" = "dev" ]; then
        export NODE_ENV="development"
        export ENVIRONMENT="dev"
        export ENV="dev"
        export LOCAL_IMAGE_NAME="${CI_PROJECT_NAME}:dev-${CI_COMMIT_SHORT_SHA}"
        export LOCAL_CONTAINER_NAME="${CI_PROJECT_NAME}-dev"
        export DOCKER_TAG="dev-${CI_COMMIT_SHORT_SHA}"
        export DOCKERFILE_DEPLOY_ENV="dev"
        export SERVICE_URL="http://${DEV_HOST_IP}:${DEV_HTTP_PORT}"
      else
        export NODE_ENV="qa"
        export ENVIRONMENT="qa"
        export ENV="qa"
        export ECR_REPOSITORY_NAME="rsp-qa-hrsp-web"
        export ECS_CLUSTER_NAME="rsp-qa-ecs"
        export ECS_SERVICE_NAME="rsp-qa-hrsp-web-service"
        export TASK_DEFINITION_NAME="rsp-qa-hrsp-web-task"
        export SERVICE_URL="https://qa.hcrsp.com"
        export DOCKER_TAG="qa-${CI_COMMIT_SHORT_SHA}"
        export DOCKERFILE_DEPLOY_ENV="qa"
      fi

      # AWS 설정 및 AssumeRole (dev는 스킵)
      if [ "$DEPLOY_ENVIRONMENT" != "dev" ]; then
        if [ -z "${AWS_DEFAULT_REGION:-}" ] || [ -z "${AWS_ACCOUNT_ID:-}" ]; then
          echo "❌ AWS 설정이 누락되었습니다."
          exit 1
        fi
        
        assume_aws_role || exit 1
        export ECR_REPOSITORY_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY_NAME}"
      fi

# 🔧 Runner 진단 (RUN_DIAG=true일 때만 표시)
check_runner:
  stage: info
  rules:
    - if: '$RUN_DIAG == "true"'
      when: manual
    - when: never
  allow_failure: true
  script:
    - |
      echo "🏃 Runner: $CI_RUNNER_DESCRIPTION"
      echo "🐳 Docker: $(docker --version)"
      echo "☁️ AWS CLI: $(aws --version)"

      if [ "$DEPLOY_ENVIRONMENT" != "dev" ]; then
        assume_aws_role && echo "✅ AssumeRole 테스트 성공" || echo "❌ AssumeRole 테스트 실패"
      fi

# 🐛 디버그 정보 (DEBUG_MODE=true일 때만 표시)
debug_info:
  stage: info
  rules:
    - if: '$DEBUG_MODE == "true"'
      when: manual
      allow_failure: true
    - when: never
  script:
    - |
      echo "🔍 디버그 정보 (DEBUG_MODE=true)"
      echo "현재 DEBUG_MODE: ${DEBUG_MODE:-false}"
      echo ""
      echo "📋 주요 환경 변수:"
      echo "CI_COMMIT_REF_NAME: $CI_COMMIT_REF_NAME"
      echo "DEPLOY_ENVIRONMENT: $DEPLOY_ENVIRONMENT"
      echo "CI_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE"
      echo "CI_JOB_ID: $CI_JOB_ID"
      echo "CI_PIPELINE_ID: $CI_PIPELINE_ID"
      echo ""
      echo "🔧 AWS 설정:"
      echo "AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-NOT_SET}"
      echo "AWS_ACCOUNT_ID: ${AWS_ACCOUNT_ID:-NOT_SET}"
      echo "DEPLOYMENT_ROLE_ARN: ${DEPLOYMENT_ROLE_ARN:-NOT_SET}"
      echo ""
      if [ -f build.env ]; then
        echo "📋 build.env 내용:"
        cat build.env
      else
        echo "📋 build.env 파일이 없습니다."
      fi

# 🐛 AssumeRole 테스트 (DEBUG_MODE=true일 때만 표시)
test_assume_role:
  stage: info
  rules:
    - if: '$DEBUG_MODE == "true" && $CI_COMMIT_REF_NAME =~ /^(qa|QA|prd|PRD|prod|production)$/'
      when: manual
      allow_failure: true
    - when: never
  script:
    - |
      echo "🔍 AssumeRole 상세 테스트"
      echo "DEPLOYMENT_ROLE_ARN: $DEPLOYMENT_ROLE_ARN"
      echo "EXTERNAL_ID: ${EXTERNAL_ID:0:10}..."
      echo ""

      if assume_aws_role; then
        echo "✅ AssumeRole 성공"
        echo "🔍 현재 권한:"
        aws sts get-caller-identity
        echo ""
        echo "🔍 ECR 접근 테스트:"
        aws ecr describe-repositories --region "$AWS_DEFAULT_REGION" --repository-names "$ECR_REPOSITORY_NAME" --query 'repositories[0].repositoryName' --output text || echo "❌ ECR 접근 실패"
        echo ""
        echo "🔍 ECS 접근 테스트:"
        aws ecs describe-clusters --region "$AWS_DEFAULT_REGION" --clusters "$ECS_CLUSTER_NAME" --query 'clusters[0].clusterName' --output text || echo "❌ ECS 접근 실패"
      else
        echo "❌ AssumeRole 실패"
        exit 1
      fi

build_image:
  stage: build
  rules:
    # dist 퍼블리시 전용 브랜치에서는 ECS 이미지를 만들지 않는다
    # (publish_init_setup_dist 주석 참고). 이 브랜치로 들어오는 MR 도 같다 —
    # MR 파이프라인의 CI_COMMIT_REF_NAME 은 소스 브랜치라 대상 브랜치를 함께 본다.
    - if: '$CI_COMMIT_REF_NAME == "release/init-setup-fe-dist" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release/init-setup-fe-dist"'
      when: never
    - when: on_success
  script:
    - |
      set -e

      # build.env 초기화 (내용 숨김)
      : > build.env
      echo "DOTENV_INITIALIZED=true" >> build.env

      if [ "$DEPLOY_ENVIRONMENT" = "dev" ]; then
        echo "🏗️ DEV 이미지 빌드..."
        
        # DEBUG: 빌드 명령 표시 (개발 시에만)
        # if [ "${DEBUG_MODE:-false}" = "true" ]; then
        #   echo "🔍 Build Command: docker build --build-arg DEPLOY_ENV=$DOCKERFILE_DEPLOY_ENV -t $LOCAL_IMAGE_NAME ."
        # fi
        
        docker build --build-arg DEPLOY_ENV="$DOCKERFILE_DEPLOY_ENV" -t "$LOCAL_IMAGE_NAME" . >/dev/null 2>&1
        
        # build.env 작성 (내용 숨김)
        {
          echo "DEPLOY_ENVIRONMENT=$DEPLOY_ENVIRONMENT"
          echo "ENVIRONMENT=$ENVIRONMENT"
          echo "NODE_ENV=$NODE_ENV"
          echo "DOCKER_TAG=$DOCKER_TAG"
          echo "LOCAL_IMAGE_NAME=$LOCAL_IMAGE_NAME"
          echo "LOCAL_CONTAINER_NAME=$LOCAL_CONTAINER_NAME"
          echo "DEV_HTTP_PORT=$DEV_HTTP_PORT"
          echo "SERVICE_URL=$SERVICE_URL"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } >> build.env
        
        # DEBUG: build.env 내용 표시 (개발 시에만)
        # if [ "${DEBUG_MODE:-false}" = "true" ]; then
        #   echo "📋 Build Environment Variables:"
        #   cat build.env
        # fi
        
        docker builder prune -f >/dev/null 2>&1 || true
        echo "✅ DEV 빌드 완료"
        exit 0
      fi

      echo "🏗️ $DEPLOY_ENVIRONMENT 이미지 빌드 및 ECR 푸시..."

      # DEBUG: ECR 정보 표시 (개발 시에만)
      # if [ "${DEBUG_MODE:-false}" = "true" ]; then
      #   echo "🔍 ECR Repository: $ECR_REPOSITORY_URI"
      #   echo "🔍 Docker Tag: $DOCKER_TAG"
      # fi

      # ECR 로그인 (출력 숨김)
      aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com" >/dev/null 2>&1

      # 이미지 빌드 및 푸시 (출력 숨김)
      docker build --build-arg DEPLOY_ENV="$DOCKERFILE_DEPLOY_ENV" -t "$ECR_REPOSITORY_URI:$DOCKER_TAG" -t "$ECR_REPOSITORY_URI:latest" . >/dev/null 2>&1
      docker push "$ECR_REPOSITORY_URI:$DOCKER_TAG" >/dev/null 2>&1
      docker push "$ECR_REPOSITORY_URI:latest" >/dev/null 2>&1

      # 정리 (출력 숨김)
      docker rmi -f "$ECR_REPOSITORY_URI:$DOCKER_TAG" "$ECR_REPOSITORY_URI:latest" >/dev/null 2>&1 || true
      docker image prune -f >/dev/null 2>&1 || true
      docker builder prune -f >/dev/null 2>&1 || true

      # build.env 작성 (내용 숨김)
      {
        echo "DEPLOY_ENVIRONMENT=$DEPLOY_ENVIRONMENT"
        echo "ENVIRONMENT=$ENVIRONMENT"
        echo "NODE_ENV=$NODE_ENV"
        echo "DOCKER_TAG=$DOCKER_TAG"
        echo "ECR_REPOSITORY_NAME=$ECR_REPOSITORY_NAME"
        echo "ECR_REPOSITORY_URI=$ECR_REPOSITORY_URI"
        echo "ECR_IMAGE_URI=$ECR_REPOSITORY_URI:$DOCKER_TAG"
        echo "ECS_CLUSTER_NAME=$ECS_CLUSTER_NAME"
        echo "ECS_SERVICE_NAME=$ECS_SERVICE_NAME"
        echo "TASK_DEFINITION_NAME=$TASK_DEFINITION_NAME"
        echo "SERVICE_URL=$SERVICE_URL"
        echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      } >> build.env

      # DEBUG: build.env 내용 표시 (개발 시에만)
      # if [ "${DEBUG_MODE:-false}" = "true" ]; then
      #   echo "📋 Build Environment Variables:"
      #   cat build.env
      # fi

      echo "✅ $DEPLOY_ENVIRONMENT 빌드 및 푸시 완료"
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - build.env
    expire_in: 2 hours
  allow_failure: false

run_on_runner_dev:
  stage: deploy
  dependencies:
    - build_image
  resource_group: dev
  rules:
    # dist 퍼블리시 전용 브랜치에서는 배포/검증을 돌리지 않는다.
    # MR 파이프라인의 CI_COMMIT_REF_NAME 은 소스 브랜치라 대상 브랜치도 함께 본다 —
    # 이 브랜치로 들어오는 MR 은 dist 빌드 검증만 하고(verify_init_setup_dist_build)
    # 배포는 하지 않는다.
    - if: '$CI_COMMIT_REF_NAME == "release/init-setup-fe-dist" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release/init-setup-fe-dist"'
      when: never
    - if: '$CI_COMMIT_REF_NAME !~ /^(qa|QA|prd|PRD|prod|production)$/'
      when: on_success
    - when: never
  script:
    - |
      set -e
      echo "🚀 DEV 컨테이너 배포..."

      VERIFY_CONTAINER="${LOCAL_CONTAINER_NAME}-verify"

      # 1) 이미지 존재 여부 확인
      docker image inspect "$LOCAL_IMAGE_NAME" >/dev/null 2>&1 || {
        echo "❌ Image not found locally: $LOCAL_IMAGE_NAME"
        echo "🔎 Local dev images:"
        docker images --format '{{.Repository}}:{{.Tag}}' | grep -E "^${CI_PROJECT_NAME}:dev-" || true
        exit 125
      }

      # 2) 검증용 컨테이너로 새 이미지 구동 테스트 (포트 바인딩 없이)
      #    → 기존 서비스는 이 시점까지 계속 운영됨
      docker rm -f "$VERIFY_CONTAINER" >/dev/null 2>&1 || true
      rm -f docker_run.err

      docker run -d \
        --name "$VERIFY_CONTAINER" \
        -e NODE_ENV=development \
        -e ENVIRONMENT=dev \
        -e ENV=dev \
        -e DEPLOY_ENV=dev \
        "$LOCAL_IMAGE_NAME" 1>/dev/null 2>docker_run.err || {
          echo "❌ 새 이미지 구동 실패 - 기존 서비스 유지"
          echo "----- docker_run.err -----"
          cat docker_run.err
          echo "--------------------------"
          exit 125
      }

      sleep 3

      # 3) 컨테이너가 즉시 종료되지 않았는지 확인
      if ! docker ps --filter "name=${VERIFY_CONTAINER}" --filter "status=running" -q | grep -q .; then
        echo "❌ 새 컨테이너가 즉시 종료됨 - 기존 서비스 유지"
        echo "🔍 컨테이너 로그:"
        docker logs "$VERIFY_CONTAINER" --tail 20 || true
        docker rm -f "$VERIFY_CONTAINER" >/dev/null 2>&1 || true
        exit 1
      fi

      echo "✅ 새 이미지 구동 확인 완료 → 기존 컨테이너 교체 시작"
      docker rm -f "$VERIFY_CONTAINER" >/dev/null 2>&1 || true

      # 4) 검증 완료 후 기존 컨테이너 제거 (서비스 최소 중단 구간)
      if docker ps -a --format '{{.Names}}' | grep -qx "$LOCAL_CONTAINER_NAME"; then
        docker rm -f "$LOCAL_CONTAINER_NAME" >/dev/null 2>&1 || true
        sleep 2
      fi

      # 5) 포트 점유 확인
      apk add --no-cache iproute2 >/dev/null 2>&1 || true
      ss -ltnp | grep -E ":${DEV_HTTP_PORT}\b" || true

      # 6) 새 컨테이너를 실제 서비스 포트로 실행
      rm -f docker_run.err
      docker run -d --rm \
        --name "$LOCAL_CONTAINER_NAME" \
        -p "${DEV_HTTP_PORT}:80" \
        -e NODE_ENV=development \
        -e ENVIRONMENT=dev \
        -e ENV=dev \
        -e DEPLOY_ENV=dev \
        "$LOCAL_IMAGE_NAME" 1>/dev/null 2>docker_run.err || {
          echo "❌ 최종 컨테이너 실행 실패"
          echo "----- docker_run.err -----"
          cat docker_run.err
          echo "--------------------------"
          exit 125
      }

      # 7) 최종 구동 확인
      docker ps --filter "name=$LOCAL_CONTAINER_NAME" --no-trunc

      # 8) 이전 이미지 정리
      OLD_DEV_IMAGES=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '^'"${CI_PROJECT_NAME}"':dev-' | grep -v -F "$LOCAL_IMAGE_NAME" || true)
      if [ -n "$OLD_DEV_IMAGES" ]; then
        echo "$OLD_DEV_IMAGES" | xargs -r docker rmi -f >/dev/null 2>&1 || true
      fi
      docker image prune -f >/dev/null 2>&1 || true

      echo "✅ DEV 배포 완료: $SERVICE_URL"

deploy_to_ecs:
  stage: deploy
  needs:
    - job: build_image
      artifacts: true
  dependencies:
    - build_image
  rules:
    # dist 퍼블리시 전용 브랜치에서는 배포/검증을 돌리지 않는다.
    # MR 파이프라인의 CI_COMMIT_REF_NAME 은 소스 브랜치라 대상 브랜치도 함께 본다 —
    # 이 브랜치로 들어오는 MR 은 dist 빌드 검증만 하고(verify_init_setup_dist_build)
    # 배포는 하지 않는다.
    - if: '$CI_COMMIT_REF_NAME == "release/init-setup-fe-dist" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release/init-setup-fe-dist"'
      when: never
    - if: '$CI_COMMIT_REF_NAME =~ /^(qa|QA|prd|PRD|prod|production)$/'
      when: on_success
    - when: never
  environment:
    name: $ENVIRONMENT_NAME
    url: $ENVIRONMENT_URL
  script:
    - |
      set -e
      echo "🚀 $DEPLOY_ENVIRONMENT ECS 배포..."

      if [ ! -f build.env ]; then
        echo "❌ build.env 파일이 없습니다."
        exit 1
      fi

      # build.env 로드 (내용 숨김)
      set -a
      . ./build.env
      set +a

      # DEBUG: 환경 변수 표시 (개발 시에만)
      # if [ "${DEBUG_MODE:-false}" = "true" ]; then
      #   echo "📋 Loaded Environment Variables:"
      #   echo "ECR_IMAGE_URI: $ECR_IMAGE_URI"
      #   echo "ECS_CLUSTER_NAME: $ECS_CLUSTER_NAME"
      #   echo "ECS_SERVICE_NAME: $ECS_SERVICE_NAME"
      #   echo "TASK_DEFINITION_NAME: $TASK_DEFINITION_NAME"
      # fi

      if [ -z "${ECR_IMAGE_URI:-}" ]; then
        echo "❌ ECR_IMAGE_URI가 설정되지 않았습니다."
        exit 1
      fi

      # AWS Secrets Manager에서 FEATURE_LEARNING_ENABLED 조회
      FEATURE_LEARNING_ENABLED="false"

      # 환경별 Secrets Manager 이름 설정
      case "$DEPLOY_ENVIRONMENT" in
        prod|production)
          SECRET_NAME="rsp-prod/app/rsp_fe"
          ;;
        qa)
          SECRET_NAME="rsp-qa/app/rsp_fe"
          ;;
        *)
          SECRET_NAME=""
          ;;
      esac

      if [ -n "$SECRET_NAME" ]; then
        SECRET_VALUE=$(aws secretsmanager get-secret-value --secret-id "$SECRET_NAME" --region "$AWS_DEFAULT_REGION" --query 'SecretString' --output text 2>/dev/null || echo "")
        if [ -n "$SECRET_VALUE" ]; then
          FEATURE_LEARNING_ENABLED=$(echo "$SECRET_VALUE" | jq -r '.FEATURE_LEARNING_ENABLED // "false"' 2>/dev/null || echo "false")
          echo "✅ Secrets Manager에서 로드: FEATURE_LEARNING_ENABLED=$FEATURE_LEARNING_ENABLED"
        else
          echo "⚠️ Secrets Manager 조회 실패 [$SECRET_NAME] → 기본값 적용: FEATURE_LEARNING_ENABLED=$FEATURE_LEARNING_ENABLED"
        fi
      else
        echo "ℹ️ 환경 $DEPLOY_ENVIRONMENT에서 Secrets Manager 미설정 → 기본값: FEATURE_LEARNING_ENABLED=$FEATURE_LEARNING_ENABLED"
      fi

      # 현재 태스크 정의 가져오기 (출력 숨김)
      CURRENT_TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition "$TASK_DEFINITION_NAME" --region "$AWS_DEFAULT_REGION" 2>/dev/null)

      # 새 태스크 정의 생성 (출력 숨김)
      NEW_TASK_DEF_JSON=$(echo "$CURRENT_TASK_DEF_JSON" | jq --arg IMAGE "$ECR_IMAGE_URI" --arg ENV "$ENVIRONMENT" --arg NODE_ENV "$NODE_ENV" --arg FEATURE_FLAG "$FEATURE_LEARNING_ENABLED" '
        .taskDefinition
        | .containerDefinitions[0].image = $IMAGE
        | .containerDefinitions[0].environment = [
            {"name":"NODE_ENV", "value": ($NODE_ENV|tostring)},
            {"name":"ENVIRONMENT", "value": ($ENV|tostring)},
            {"name":"ENV", "value": ($ENV|tostring)},
            {"name":"DEPLOY_ENV", "value": ($ENV|tostring)},
            {"name":"VITE_FEATURE_LEARNING_ENABLED", "value": ($FEATURE_FLAG|tostring)}
          ]
        | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
      ')

      CURRENT_IMAGE=$(echo "$CURRENT_TASK_DEF_JSON" | jq -r '.taskDefinition.containerDefinitions[0].image')

      if [ "$CURRENT_IMAGE" = "$ECR_IMAGE_URI" ]; then
        echo "🔄 이미지 동일 - 기존 태스크 정의 재사용"
        NEW_TASK_DEF_ARN=$(echo "$CURRENT_TASK_DEF_JSON" | jq -r '.taskDefinition.taskDefinitionArn')
      else
        echo "📝 새 태스크 정의 등록..."
        NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --region "$AWS_DEFAULT_REGION" --cli-input-json "$NEW_TASK_DEF_JSON" --query 'taskDefinition.taskDefinitionArn' --output text 2>/dev/null)
      fi

      # ECS 서비스 업데이트 (출력 숨김)
      aws ecs update-service --cluster "$ECS_CLUSTER_NAME" --service "$ECS_SERVICE_NAME" --task-definition "$NEW_TASK_DEF_ARN" --region "$AWS_DEFAULT_REGION" >/dev/null 2>&1

      # build.env 업데이트 (내용 숨김)
      echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> build.env

      # DEBUG: 태스크 정의 ARN 표시 (개발 시에만)
      # if [ "${DEBUG_MODE:-false}" = "true" ]; then
      #   echo "📋 New Task Definition ARN: $NEW_TASK_DEF_ARN"
      # fi

      echo "✅ $DEPLOY_ENVIRONMENT ECS 배포 완료"
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - build.env
    expire_in: 2 hours
  allow_failure: false

# 📦 init-setup FE dist 퍼블리시
#
# init-setup 은 ECS 웹이 아니라 로봇(cloi_entropos)에 실려 나가는 앱이라, 루트 build
# 스크립트에서 --filter=!init-setup 으로 제외되어 있다. 여기서만 따로 빌드해서
# 산출물(apps-dist/init-setup)을 얇은 dist 리포에 push 하고, cloi_entropos 가 그 리포를
# services/app/init-setup/frontend/dist 서브모듈로 pin 해서 이미지에 넣는다.
#
# 실행 방법 (ECS 배포와 분리된 전용 브랜치):
#   release/init-setup-fe-dist 브랜치에 파이프라인이 생기면(push/web 무관) 자동 실행된다.
#   단 MR 파이프라인은 제외한다 — 머지 전 코드가 dist 리포로 나가면 안 되므로,
#   그 브랜치로 들어오는 MR 은 verify_init_setup_dist_build 가 빌드만 검증한다.
# 이 브랜치에서는 build_image / run_on_runner_dev / deploy_to_ecs / verify_* 가 모두
# 스킵되어 dist 퍼블리시만 돈다. 반대로 다른 브랜치의 평소 배포 파이프라인에서는
# 이 job 이 스킵된다.
#
# 빌드/푸시 대상: pnpm run build:init-setup → dist 리포 qa 브랜치.
# dist 리포는 빌드 산출물만 담으며 .gitattributes(* -text)로 EOL 변환을 금지한다
# (Windows 체크아웃이 번들 JS 를 CRLF 로 바꿔 diff 가 통째로 튀는 것을 막는다).
#
# 선행 설정: dist 리포의 project access token (role Developer, scope write_repository) 을
# opcon CI/CD 변수 INIT_SETUP_DIST_TOKEN (masked + protected) 으로 등록한다.
# deploy token 은 쓸 수 없다 — git 리포에 대해서는 읽기 전용이고 write 스코프가 없다.
# 미설정이면 이 job 은 아무 것도 하지 않고 통과한다.
publish_init_setup_dist:
  stage: deploy
  # default 의 before_script 는 alpine(apk) + AWS AssumeRole 전용이라 상속하지 않는다.
  image: node:20-bookworm-slim
  before_script: []
  needs: []
  variables:
    # dist 리포는 opcon 과 같은 그룹의 형제 프로젝트다. 프로젝트명만 지정하고 나머지
    # (프로토콜/호스트/그룹 경로) 는 런타임에 CI_PROJECT_URL 에서 잘라 쓴다 —
    # 경로를 손으로 적거나 CI_SERVER_HOST + CI_PROJECT_NAMESPACE 로 조립하면
    # 최상위 그룹(hub) 이 빠지는 사고가 난다.
    DIST_REPO_NAME: init-setup-fe-dist
    GIT_DEPTH: '0'
  rules:
    # MR 파이프라인에서는 절대 push 하지 않는다 — 머지되지 않은 코드가 dist 리포로
    # 나가면 로봇이 그 산출물을 받는다. MR 은 verify_init_setup_dist_build 로 검증만 한다.
    # (MR 파이프라인의 CI_COMMIT_REF_NAME 은 소스 브랜치라 아래 조건에 그대로 걸린다.)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # ECS 배포와 완전히 분리한다 — dist 전용 브랜치에서만 돌고, 그 브랜치에서는
    # 배포/검증 job 이 전부 스킵된다.
    - if: '$CI_COMMIT_REF_NAME == "release/init-setup-fe-dist"'
      when: on_success
      variables:
        DIST_BUILD_SCRIPT: 'build:init-setup'
        DIST_BRANCH: 'qa'
    - when: never
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  script:
    - |
      set -e
      if [ -z "${INIT_SETUP_DIST_TOKEN:-}" ]; then
        echo "⏭️  INIT_SETUP_DIST_TOKEN 미설정 — dist 퍼블리시를 건너뜁니다."
        exit 0
      fi
      apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      corepack enable
      corepack prepare pnpm@10.30.3 --activate
      pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
      pnpm install --frozen-lockfile
      pnpm run "$DIST_BUILD_SCRIPT"

      # 산출물 존재를 먼저 확인한다 — vite outDir 이 바뀌면 여기서 걸려야 한다
      # (빈 커밋을 push 해서 로봇 FE 를 날리는 것보다 낫다).
      test -s apps-dist/init-setup/index.html
      test -s apps-dist/init-setup/build-info.json

      # CI_PROJECT_URL = <proto>://<host>/<그룹 경로>/opcon (GitLab 이 보장하는 브라우저 URL).
      # 마지막 세그먼트만 형제 프로젝트명으로 바꾸면 프로토콜·호스트·전체 그룹 경로가
      # 자동으로 맞는다. 조립하지 않으므로 hub 같은 상위 그룹이 빠질 수 없다.
      DIST_REPO_URL="${CI_PROJECT_URL%/*}/${DIST_REPO_NAME}.git"

      # 자격증명을 뺀 URL 을 먼저 찍는다 — GitLab 은 경로 오타와 토큰 권한 부족을
      # 똑같이 404 "repository not found" 로 응답하므로, 로그에 URL 이 없으면 둘을 구분할 수 없다.
      echo "🔽 dist 리포 클론: ${DIST_REPO_URL} (branch ${DIST_BRANCH})"

      # project access token 의 username 은 oauth2 다. URL 을 다시 조립하지 않고
      # 스킴 뒤에 자격증명만 끼워 넣는다(POSIX 치환 — sh/bash 양쪽에서 동작).
      DIST_PROTO="${DIST_REPO_URL%%://*}"
      DIST_REST="${DIST_REPO_URL#*://}"
      git clone --quiet "${DIST_PROTO}://oauth2:${INIT_SETUP_DIST_TOKEN}@${DIST_REST}" /tmp/dist
      cd /tmp/dist
      # 원격에 브랜치가 있으면 반드시 그 히스토리 위에 쌓아야 한다. clone 은 기본
      # 브랜치를 체크아웃하므로, 여기서 -B 를 무조건 쓰면 기본 브랜치 위치에 브랜치를
      # 새로 만들어 원격 히스토리를 잃고 non-fast-forward 로 거부된다.
      # force push 로 우회하면 안 된다 — cloi_entropos 가 특정 커밋을 서브모듈로
      # pin 하고 있어서, 히스토리를 갈아치우면 그 포인터가 끊긴다.
      if git show-ref --verify --quiet "refs/remotes/origin/${DIST_BRANCH}"; then
        git checkout -q "$DIST_BRANCH"
      else
        echo "ℹ️  원격에 ${DIST_BRANCH} 가 없음 — 기본 브랜치에서 새로 만든다(최초 실행)."
        git checkout -q -B "$DIST_BRANCH"
      fi

      # dist 리포가 직접 소유하는 파일(.git/.gitattributes/README.md)만 남기고 비운 뒤
      # 새 산출물로 채운다. (해시 파일명이 매 빌드 바뀌므로 덮어쓰기만 하면 옛 번들이 계속 쌓인다.)
      find . -mindepth 1 -maxdepth 1 \
        ! -name .git ! -name .gitattributes ! -name README.md -exec rm -rf {} +
      cp -a "$CI_PROJECT_DIR/apps-dist/init-setup/." .

      git add -A
      if git diff --cached --quiet; then
        echo "✅ 변경 없음 — push 생략"
        exit 0
      fi
      git -c user.email="opcon-ci@lge.com" -c user.name="opcon CI" commit -q -m \
        "[init-setup] dist ${DIST_BRANCH} from opcon ${CI_COMMIT_SHORT_SHA}

      source: ${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}
      pipeline: ${CI_PIPELINE_URL}
      build script: pnpm run ${DIST_BUILD_SCRIPT}"
      git push --quiet origin "$DIST_BRANCH"
      echo "✅ push 완료: ${DIST_REPO_URL} ${DIST_BRANCH} $(git rev-parse --short HEAD)"
  allow_failure: false

# 🔎 init-setup FE dist 빌드 검증 (MR 전용)
#
# release/init-setup-fe-dist 로 들어오는 MR 은 머지되는 순간 dist 리포로 push 되어
# 로봇이 그 산출물을 받는다. 그래서 MR 단계에서 빌드가 되는지만 미리 확인한다 —
# publish_init_setup_dist 와 같은 빌드를 돌리되 dist 리포 클론/커밋/push 는 하지 않는다.
# 토큰도 필요 없다(INIT_SETUP_DIST_TOKEN 미설정이어도 검증은 돈다).
#
# 이 MR 에서는 build_image / run_on_runner_dev / deploy_to_ecs / verify_* 가 모두
# 스킵되므로(각 job 의 rules 참고) 파이프라인에 이 job 만 남는다.
verify_init_setup_dist_build:
  stage: build
  # default 의 before_script 는 alpine(apk) + AWS AssumeRole 전용이라 상속하지 않는다.
  image: node:20-bookworm-slim
  before_script: []
  needs: []
  variables:
    DIST_BUILD_SCRIPT: 'build:init-setup'
  rules:
    # MR 파이프라인 전용. CI_MERGE_REQUEST_* 는 MR 파이프라인에서만 채워지므로 먼저 끊는다.
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      when: never
    # 대상이 dist 브랜치인 MR — 머지되면 곧바로 퍼블리시되므로 미리 빌드를 확인한다.
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release/init-setup-fe-dist"'
      when: on_success
    # 소스가 dist 브랜치인 MR — 다른 job 이 전부 스킵되어 job 0 개로 파이프라인 생성이
    # 실패하는 것을 막는다. 조건을 한 줄로 합치지 않는 이유는 GitLab rules if 가
    # 괄호를 지원하지 않아 && 와 || 를 섞으면 우선순위가 모호해지기 때문이다.
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "release/init-setup-fe-dist"'
      when: on_success
    - when: never
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  script:
    - |
      set -e
      corepack enable
      corepack prepare pnpm@10.30.3 --activate
      pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
      pnpm install --frozen-lockfile
      pnpm run "$DIST_BUILD_SCRIPT"

      # 퍼블리시 job 과 같은 산출물 검사 — vite outDir 이 바뀌면 머지 전에 여기서 걸린다.
      test -s apps-dist/init-setup/index.html
      test -s apps-dist/init-setup/build-info.json
      echo "✅ dist 빌드 검증 완료 (push 하지 않음)"
  allow_failure: false

verify_dev:
  stage: verify
  dependencies:
    - run_on_runner_dev
  rules:
    # dist 퍼블리시 전용 브랜치에서는 배포/검증을 돌리지 않는다.
    # MR 파이프라인의 CI_COMMIT_REF_NAME 은 소스 브랜치라 대상 브랜치도 함께 본다 —
    # 이 브랜치로 들어오는 MR 은 dist 빌드 검증만 하고(verify_init_setup_dist_build)
    # 배포는 하지 않는다.
    - if: '$CI_COMMIT_REF_NAME == "release/init-setup-fe-dist" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release/init-setup-fe-dist"'
      when: never
    - if: '$CI_COMMIT_REF_NAME !~ /^(qa|QA|prd|PRD|prod|production)$/'
      when: on_success
    - when: never
  script:
    - |
      set -e
      echo "🔍 DEV 헬스체크..."
      sleep 5

      if curl -f --max-time 10 "http://${DEV_HOST_IP}:${DEV_HTTP_PORT}/health" >/dev/null 2>&1; then
        echo "✅ DEV 헬스체크 성공"
      else
        echo "❌ DEV 헬스체크 실패"
        echo "🔍 컨테이너 상태:"
        docker ps --filter "name=$LOCAL_CONTAINER_NAME"
        echo "🔍 컨테이너 로그 (최근 10줄):"
        docker logs --tail 10 "$LOCAL_CONTAINER_NAME" || true
        exit 1
      fi

verify_ecs:
  stage: verify
  needs:
    - job: deploy_to_ecs
      artifacts: true
  dependencies:
    - deploy_to_ecs
  rules:
    # dist 퍼블리시 전용 브랜치에서는 배포/검증을 돌리지 않는다.
    # MR 파이프라인의 CI_COMMIT_REF_NAME 은 소스 브랜치라 대상 브랜치도 함께 본다 —
    # 이 브랜치로 들어오는 MR 은 dist 빌드 검증만 하고(verify_init_setup_dist_build)
    # 배포는 하지 않는다.
    - if: '$CI_COMMIT_REF_NAME == "release/init-setup-fe-dist" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release/init-setup-fe-dist"'
      when: never
    - if: '$CI_COMMIT_REF_NAME =~ /^(qa|QA|prd|PRD|prod|production)$/'
      when: on_success
    - when: never
  script:
    - |
      set -e
      echo "🔍 $DEPLOY_ENVIRONMENT ECS 배포 검증..."

      # build.env 로드 (내용 숨김)
      if [ -f build.env ]; then
        set -a
        . ./build.env
        set +a
      fi

      echo "⏳ 서비스 안정화 대기 (60초)..."
      sleep 60

      # 헬스체크 (최대 10회 재시도)
      for i in $(seq 1 10); do
        if curl -f --max-time 10 "$SERVICE_URL/health" >/dev/null 2>&1; then
          echo "✅ $DEPLOY_ENVIRONMENT 헬스체크 성공"
          exit 0
        else
          echo "⚠️ 헬스체크 실패 ($i/10)"
          if [ $i -eq 10 ]; then
            echo "❌ 헬스체크 최종 실패"
            
            # 실패 시 디버깅 정보
            echo "🔍 ECS 서비스 상태:"
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER_NAME" \
              --services "$ECS_SERVICE_NAME" \
              --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount}' \
              --output table
            
            echo "🔍 최근 이벤트:"
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER_NAME" \
              --services "$ECS_SERVICE_NAME" \
              --query 'services[0].events[0:3].{Time:createdAt,Message:message}' \
              --output table
            
            exit 1
          else
            sleep 30
          fi
        fi
      done
