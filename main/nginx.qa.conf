worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # ✅ 파일 정보 캐싱 (stat() 호출 감소)
  open_file_cache max=1000 inactive=20s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;

  # ✅ QA: 상세 로그
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log info;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------
    # Health Check
    # -------------------------
    location = /health {
      access_log off;
      return 200 "OK";
    }

    # -------------------------
    # Main App (QA)
    # -------------------------
    location / {
      try_files $uri $uri/ /index.html;
    }

    # ✅ HTML 파일: 항상 최신 버전 확인 (no-cache)
    location ~* \.html$ {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }

    # -------------------------
    # OTA App (QA)
    # -------------------------
    location /ota/ {
      alias /usr/share/nginx/html/ota/;
      try_files $uri $uri/ /ota/index.html;
    }

    # -------------------------
    # Robot App (QA)
    # -------------------------
    location /robot/ {
      alias /usr/share/nginx/html/robot/;
      try_files $uri $uri/ /robot/index.html;
    }

    # -------------------------
    # INIT-SETUP App
    # -------------------------
    location /init-setup/ {
      alias /usr/share/nginx/html/init-setup/;
      try_files $uri $uri/ /init-setup/index.html;
    }

    # -------------------------
    # TMS App
    # -------------------------
    location /tms/ {
      alias /usr/share/nginx/html/tms/;
      try_files $uri $uri/ /tms/index.html;
    }

    # -------------------------
    # CMS App
    # -------------------------
    location /cms/ {
      alias /usr/share/nginx/html/cms/;
      try_files $uri $uri/ /cms/index.html;
    }

    # -------------------------
    # Learning App (QA)
    # -------------------------
    location /learning/ {
      alias /usr/share/nginx/html/learning/;
      try_files $uri $uri/ /learning/index.html;
    }

    # ✅ Static Assets (QA: 해시 기반이므로 장기 캐시 가능)
    # - 번들 파일명에 해시 포함 (main.abc123.js)
    # - 내용 변경 시 새 해시 생성 → 자동 캐시 버스팅
    location ~* ^/(assets|ota/assets|robot/assets|cms/assets|learning/assets)/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # -------------------------
    # Error Pages
    # -------------------------
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
  }
}